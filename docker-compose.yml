services:
  yummy-gateway:
    build: .
    image: yummy-gateway:latest
    container_name: yummy-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      GATEWAY_LISTEN: ":8080"
      GATEWAY_DB_PATH: /data/gateway.db
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  gateway-data:
